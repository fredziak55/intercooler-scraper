<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Intercoolerów</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🏆 Ranking opłacalności intercoolerów</h1>
    <p class="subtitle">Posortowane od najlepszego stosunku ceny do pojemności rdzenia (PLN/cm³)</p>

    <div class="filters">
      <div class="filter-group">
        <label for="min-price">Cena od (PLN):</label>
        <input type="number" id="min-price" placeholder="np. 300">
      </div>
      <div class="filter-group">
        <label for="max-price">Cena do (PLN):</label>
        <input type="number" id="max-price" placeholder="np. 1500">
      </div>
      <button id="filter-btn" class="btn btn-primary">Filtruj</button>
      <button id="reset-btn" class="btn btn-secondary">Resetuj</button>
    </div>

    <div id="error-msg" class="error" style="display: none;"></div>

    <table>
      <thead>
        <tr>
          <th data-sort="originalRank" class="sortable">Miejsce ↕</th>
          <th data-sort="name" class="sortable">Nazwa modelu ↕</th>
          <th data-sort="pojemnoscCm3" class="sortable">Pojemność ↕</th>
          <th data-sort="price" class="sortable">Cena ↕</th>
          <th data-sort="cenaZaCm3" class="sortable">Opłacalność ↕</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="results-body">
        </tbody>
    </table>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
